aid: aim
name: AIM Intelligent Machines
description: >-
  AIM (AIM Intelligent Machines) is a Redmond, Washington robotics and artificial-intelligence
  company building autonomous earthmoving for mining, construction and defense. Its plug-and-play
  retrofit kit converts existing heavy equipment — excavators, bulldozers, haul trucks — into
  self-operating machines regardless of make, model, size or age, while preserving the OEM
  warranty, pairing rugged onboard hardware and 360-degree camera-based perception with a
  tablet-based control interface and a "Site Intelligence" analytics dashboard for remote fleet
  tasking, terrain mapping and productivity reporting. Founded in 2021 by engineers from Waymo,
  SpaceX, Google, Tesla, Apple, Microsoft, Trimble and Hexagon, AIM is backed by General Catalyst
  (partners Quentin Clark and Max Rimpel), Khosla Ventures, DCVC, Human Capital, Ironspring
  Ventures and Mantis, and has announced a strategic partnership with Komatsu and a LiDAR
  partnership with Ouster. AIM sells through equipment dealers rather than a self-serve product,
  and as of this pass publishes no public developer program, API reference, SDK or machine-readable
  contract of any kind — its entire public web surface is eight marketing and legal pages.
