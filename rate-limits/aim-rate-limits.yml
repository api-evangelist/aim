notes:
  - >-
    The only availability commitment AIM publishes is contractual rather than numeric —
    its Terms of Service say AIM "will use commercially reasonable efforts to maintain
    availability and performance of the Cloud Backend" and acknowledge that temporary
    interruption or degradation may occur for maintenance, upgrades, network or equipment
    reasons. No SLA percentage, credit schedule or rate ceiling is stated.
  - >-
    The Terms of Service also reserve a throttling-adjacent right that is operational, not
    API-level. AIM "may enable, disable, limit or suspend autonomous operation remotely to
    maintain safety, compliance or system integrity", and may suspend an AIMWare unit or
    the Cloud Backend as a whole. That governs machines, not requests.
