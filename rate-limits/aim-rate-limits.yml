description: >-
  AIM Intelligent Machines publishes no API and therefore no rate limits. There is no
  developer portal, no API reference and no machine-readable contract on any host AIM
  controls, so there is no documented quota, window, burst allowance or throttling
  response to record, and nothing to observe on a live unauthenticated response because
  no public endpoint exists to call. This is an honest zero, not an unmeasured gap.
